---
name: "Update packaged csi-attacher version"

sources:
  upstream:
    name: Find the latest vsphere-csi-driver release
    kind: githubrelease
    spec:
      owner: kubernetes-sigs
      repository: vsphere-csi-driver
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver

  attacher:
    name: Extract the csi-attacher tag packaged by vsphere-csi-driver
    kind: file
    dependson:
      - "upstream"
    spec:
      file: 'https://raw.githubusercontent.com/kubernetes-sigs/vsphere-csi-driver/{{ source "upstream" }}/manifests/vanilla/vsphere-csi-driver.yaml'
      matchpattern: 'image:\s+registry\.k8s\.io/sig-storage/csi-attacher:\S+'
    transformers:
      - trimprefix: 'image: registry.k8s.io/sig-storage/csi-attacher:'

targets:
  tag:
    name: "Update TAG with the packaged csi-attacher version"
    kind: file
    scmid: default
    sourceid: attacher
    spec:
      file: TAG
      forcecreate: true

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Update TAG to the packaged csi-attacher version {{ source "attacher" }}'
    kind: github/pullrequest
    spec:
      automerge: false
    scmid: default
